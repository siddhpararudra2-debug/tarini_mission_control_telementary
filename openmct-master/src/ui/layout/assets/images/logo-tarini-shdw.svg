<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="20 0 640 150" xml:space="preserve">
  <defs>
    <filter height="140%" width="150%" id="Tarini_Shadow" x="-20%" y="-20%">
      <feGaussianBlur in="SourceAlpha" result="blur" stdDeviation="6"></feGaussianBlur>
      <feOffset in="blur" dy="4" dx="0" result="offsetBlurredAlpha"></feOffset>
      <feMerge>
        <feMergeNode in="offsetBlurredAlpha"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <linearGradient id="tariniSplashGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <g filter="url(#Tarini_Shadow)">
    <!-- Rocket Emblem -->
    <g transform="translate(60, 20)">
      <circle cx="55" cy="55" r="48" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.5" stroke-dasharray="16 8" />
      <path d="M 12 70 C 28 26 82 26 98 70" fill="none" stroke="url(#tariniSplashGrad)" stroke-width="6" stroke-linecap="round" />
      <path d="M 55 20 L 75 80 L 55 68 L 35 80 Z" fill="#38bdf8" />
      <circle cx="55" cy="52" r="7" fill="#ffffff" />
    </g>
    <!-- Brand Title -->
    <text x="200" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="76" letter-spacing="12" fill="#ffffff">TARINI</text>
    <text x="205" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="9" fill="#38bdf8">MISSION CONTROL</text>
  </g>
</svg>
