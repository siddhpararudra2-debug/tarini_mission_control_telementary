<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345.7 72.3">
  <defs>
    <linearGradient id="tariniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Orbit Ring Icon -->
  <g transform="translate(10, 8)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="url(#tariniGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="8 4" />
    <path d="M 6 36 C 14 14 42 14 50 36" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Rocket Delta Icon -->
    <path d="M 28 10 L 38 42 L 28 36 L 18 42 Z" fill="url(#tariniGrad)" />
    <circle cx="28" cy="27" r="3.5" fill="#ffffff" />
  </g>
  <!-- Brand Text -->
  <text x="78" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="36" letter-spacing="6" fill="#ffffff">TARINI</text>
  <text x="80" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10.5" letter-spacing="4.5" fill="#38bdf8">MISSION CONTROL</text>
</svg>
